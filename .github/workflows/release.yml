name: Release

on:
  workflow_run:
    workflows:
      - Windows
      - Ubuntu
      - macOS
      - BSD
    types:
      - completed
    branches:
      - TriggerDS

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for workflows to complete
        run: |
          echo "Waiting for all workflows to complete..."
          sleep 60

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check for required artifacts
        run: |
          echo "Checking for required artifacts..."
          ls -R artifacts
          # Check if we have at least some artifacts
          if [ ! -d "artifacts" ] || [ -z "$(ls -A artifacts)" ]; then
            echo "No artifacts found, skipping release"
            exit 1
          fi

      - name: Generate release tag
        id: tag
        run: |
          TAG_NAME="release-$(date +%Y%m%d-%H%M%S)"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG_NAME}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: melonDS Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
